<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Raspadinha 💗</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: #fff4f7;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow-x: hidden;
}

/* CORAÇÕES DE FUNDO */

.coracao {
    position: fixed;
    font-size: 25px;
    animation: flutuar 5s infinite ease-in-out;
    opacity: 0.7;
    pointer-events: none;
}

.c1 { left: 8%; top: 15%; animation-delay: 0s; }
.c2 { left: 90%; top: 20%; animation-delay: 1s; }
.c3 { left: 15%; top: 80%; animation-delay: 2s; }
.c4 { left: 85%; top: 75%; animation-delay: 3s; }

@keyframes flutuar {
    0%, 100% {
        transform: translateY(0) rotate(-10deg);
    }

    50% {
        transform: translateY(-25px) rotate(10deg);
    }
}

/* CONTAINER */

.container {
    width: 95%;
    max-width: 600px;
    text-align: center;
    padding: 25px 15px;
}

/* TÍTULO */

.titulo {
    font-size: 52px;
    font-weight: bold;
    color: #f05b83;
    text-shadow:
        3px 3px white,
        5px 5px #ffc3d2;
    margin-bottom: 10px;
}

.subtitulo {
    display: inline-block;
    background: #ead8f5;
    color: #735080;
    padding: 12px 25px;
    border-radius: 25px;
    font-size: 18px;
    border: 3px dashed #c99adb;
    margin-bottom: 20px;
}

/* RASPADINHA */

.raspadinha {
    position: relative;
    width: 100%;
    height: 400px;
    border-radius: 25px;
    background: #fff;
    border: 5px solid #ffb6c9;
    box-shadow: 0 10px 25px rgba(200, 100, 130, 0.2);
    overflow: hidden;
}

/* DECORAÇÃO */

.fita {
    position: absolute;
    width: 100px;
    height: 35px;
    background: #ffb4c8;
    transform: rotate(-12deg);
    top: 10px;
    left: -20px;
    z-index: 5;
    opacity: 0.9;
}

.fita2 {
    position: absolute;
    width: 100px;
    height: 35px;
    background: #d8b3ed;
    transform: rotate(-12deg);
    bottom: 10px;
    right: -20px;
    z-index: 5;
}

/* CONTEÚDO ESCONDIDO */

.conteudo {
    position: absolute;
    inset: 0;
    background: #fffaf8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.conteudo h2 {
    color: #8a5360;
    font-size: 23px;
    margin: 0 0 5px;
}

.mensagem {
    color: #f05b83;
    font-size: 30px;
    font-weight: bold;
    line-height: 1.2;
    margin: 5px 0 15px;
}

/* IMAGEM */



.imagem-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 12px;
}

/* URSINHO */

.ursinho {
    position: absolute;
    bottom: 5px;
    left: 15px;
    font-size: 70px;
    z-index: 4;
}

/* CANVAS */

canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    cursor: crosshair;
}

/* BOTÃO */

button {
    margin-top: 25px;
    padding: 15px 35px;
    border: none;
    border-radius: 18px;
    background: #f05b83;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 6px 0 #d84268;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-3px);
}

button:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 #d84268;
}

/* RODAPÉ */

.rodape {
    margin-top: 20px;
    color: #d8899e;
    font-size: 16px;
}

</style>
</head>

<body>

<!-- DECORAÇÕES -->

<div class="coracao c1">💗</div>
<div class="coracao c2">💕</div>
<div class="coracao c3">💖</div>
<div class="coracao c4">💗</div>

<div class="container">

    <div class="titulo">
        pra você 💕
    </div>

    <div class="subtitulo">
        💗 Raspe e descubra uma surpresa! 💗
    </div>

    <div class="raspadinha">

        <div class="fita"></div>
        <div class="fita2"></div>

        <!-- CONTEÚDO QUE SERÁ REVELADO -->

        <div class="conteudo">

            <div class="imagem-container">
                <img src="ursinhofofo.png" alt="Nossa foto">
            </div>

        </div>

        <!-- CAMADA DA RASPADINHA -->

        <canvas id="canvas"></canvas>

    </div>

    <button onclick="novaRaspadinha()">
        🔄 Raspar de novo
    </button>

    <div class="rodape">
        💗 Feito com carinho pra você 💗
    </div>

</div>


<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let raspando = false;

function ajustarCanvas() {

    const largura = canvas.clientWidth;
    const altura = canvas.clientHeight;

    canvas.width = largura;
    canvas.height = altura;

    criarRaspadinha();
}

function criarRaspadinha() {

    ctx.globalCompositeOperation = "source-over";

    /* FUNDO METÁLICO */

    const gradiente = ctx.createLinearGradient(
        0,
        0,
        canvas.width,
        canvas.height
    );

    gradiente.addColorStop(0, "#c8c8c8");
    gradiente.addColorStop(0.25, "#eeeeee");
    gradiente.addColorStop(0.5, "#bcbcbc");
    gradiente.addColorStop(0.75, "#eeeeee");
    gradiente.addColorStop(1, "#b8b8b8");

    ctx.fillStyle = gradiente;

    ctx.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    /* TEXTO */

    ctx.fillStyle = "#777";

    ctx.font = "bold 28px Arial";

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    ctx.fillText(
        "RASPE AQUI ✨",
        canvas.width / 2,
        canvas.height / 2
    );

    /* CORAÇÕES */

    ctx.font = "30px Arial";

    ctx.fillText(
        "💗",
        60,
        60
    );

    ctx.fillText(
        "💕",
        canvas.width - 60,
        canvas.height - 60
    );
}


/* COMEÇAR A RASPAGEM */

canvas.addEventListener("mousedown", function() {
    raspando = true;
});

canvas.addEventListener("mouseup", function() {
    raspando = false;
});

canvas.addEventListener("mouseleave", function() {
    raspando = false;
});


canvas.addEventListener("mousemove", function(e) {

    if (!raspando) return;

    const posicao = pegarPosicao(e);

    raspar(
        posicao.x,
        posicao.y
    );

});


/* CELULAR */

canvas.addEventListener("touchstart", function(e) {

    e.preventDefault();

    raspando = true;

    const posicao = pegarPosicao(e);

    raspar(
        posicao.x,
        posicao.y
    );

});


canvas.addEventListener("touchmove", function(e) {

    e.preventDefault();

    if (!raspando) return;

    const posicao = pegarPosicao(e);

    raspar(
        posicao.x,
        posicao.y
    );

});


canvas.addEventListener("touchend", function() {

    raspando = false;

});


/* PEGAR POSIÇÃO DO MOUSE/TOQUE */

function pegarPosicao(e) {

    const rect = canvas.getBoundingClientRect();

    let x;
    let y;

    if (e.touches) {

        x =
            e.touches[0].clientX -
            rect.left;

        y =
            e.touches[0].clientY -
            rect.top;

    } else {

        x =
            e.clientX -
            rect.left;

        y =
            e.clientY -
            rect.top;

    }

    return {
        x: x,
        y: y
    };

}


/* RASPAR */

function raspar(x, y) {

    ctx.globalCompositeOperation =
        "destination-out";

    ctx.beginPath();

    ctx.arc(
        x,
        y,
        27,
        0,
        Math.PI * 2
    );

    ctx.fill();

    verificarRaspagem();

}


/* VERIFICAR QUANTO FOI RASPADO */

function verificarRaspagem() {

    const pixels =
        ctx.getImageData(
            0,
            0,
            canvas.width,
            canvas.height
        ).data;

    let apagados = 0;

    for (
        let i = 3;
        i < pixels.length;
        i += 4
    ) {

        if (pixels[i] === 0) {

            apagados++;

        }

    }

    const total =
        canvas.width *
        canvas.height;

    const porcentagem =
        (apagados / total) * 100;


    /* SE RASPAR MAIS DE 45%, REVELA TUDO */

    if (porcentagem > 45) {

        revelarTudo();

    }

}


/* REVELAR */

function revelarTudo() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    canvas.style.pointerEvents = "none";

    criarConfetes();

}


/* CONFETES */

function criarConfetes() {

    for (let i = 0; i < 35; i++) {

        const confete =
            document.createElement("div");

        confete.innerHTML =
            ["💗", "💕", "✨", "💖", "🎉"][
                Math.floor(
                    Math.random() * 5
                )
            ];

        confete.style.position = "fixed";

        confete.style.left =
            Math.random() * 100 + "vw";

        confete.style.top = "-30px";

        confete.style.fontSize =
            20 + Math.random() * 20 + "px";

        confete.style.zIndex = "999";

        document.body.appendChild(confete);

        const duracao =
            2 + Math.random() * 3;

        confete.animate(
            [
                {
                    transform:
                        "translateY(0) rotate(0deg)",
                    opacity: 1
                },
                {
                    transform:
                        `translateY(110vh) rotate(360deg)`,
                    opacity: 0
                }
            ],
            {
                duration:
                    duracao * 1000,
                easing:
                    "ease-out"
            }
        );

        setTimeout(() => {
            confete.remove();
        }, duracao * 1000);

    }

}


/* NOVA RASPADINHA */

function novaRaspadinha() {

    canvas.style.pointerEvents = "auto";

    ajustarCanvas();

}


/* INICIAR */

window.addEventListener(
    "resize",
    ajustarCanvas
);

ajustarCanvas();

</script>

</body>
</html>
